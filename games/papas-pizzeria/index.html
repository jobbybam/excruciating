<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Papa's Pizzeria</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#080808; }
    body { display:flex; align-items:center; justify-content:center; }
    #game { width:100vw; height:100vh; }
    ruffle-player { width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      publicPath: new URL("/games/ruffle/", window.location.origin).href,
      autoplay: "on",
      unmuteOverlay: "visible",
      letterbox: "on",
      backgroundColor: "#080808",
      scale: "showAll",
      forceScale: true,
      logLevel: "error"
    };
  </script>
  <script src="/games/ruffle/ruffle.js"></script>
  <script>
    window.addEventListener("load", async () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("game").appendChild(player);
      try {
    await player.ruffle().load(new URL("./game.swf", window.location.href).href);
  } catch (error) {
    console.error("Failed to load the locally hosted Papa's SWF or Ruffle WASM.", error);
    const message = document.createElement("div");
    message.textContent = "The game could not start. Ruffle failed to load its local game or WebAssembly files. Reload the page or check the deployment.";
    message.style.cssText = "position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#080808;color:#fff;font:16px system-ui;text-align:center;z-index:99999";
    document.body.appendChild(message);
  }
    });
  </script>
</body>
</html>
