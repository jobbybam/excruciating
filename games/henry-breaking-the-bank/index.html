<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Henry Stickmin: Breaking the Bank</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080808; }
    #game { width: 100vw; height: 100vh; height: 100dvh; touch-action: manipulation; }
    ruffle-player { width: 100%; height: 100%; }
    #game-error { position: fixed; inset: auto 16px 16px; z-index: 1; max-width: 540px; margin: auto; padding: 12px 14px; border: 1px solid #633; border-radius: 10px; background: #1b1010; color: #fff; font: 13px/1.5 system-ui, sans-serif; }
    #game-error[hidden] { display: none; }
  </style>
  <script src="/game-shell.js" defer></script>
  <script src="/ruffle-game.js" defer></script>
</head>
<body>
  <div id="game" data-swf="game.swf" aria-label="Henry Stickmin: Breaking the Bank"></div>
  <p id="game-error" role="status" hidden></p>
</body>
</html>
