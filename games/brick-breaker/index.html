<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Brick Breaker</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#f4f5f7}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#182238 0,#08090d 58%)}main{width:min(100vw,900px);height:100dvh;max-height:850px;display:flex;flex-direction:column;padding:clamp(10px,2vw,22px);gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(18px,3vw,25px);font-weight:850;letter-spacing:.04em}.stats{display:flex;gap:clamp(10px,3vw,24px);font-size:13px;color:#b7c0d0}.stats b{display:block;color:#fff;font-size:17px;margin-top:2px}.actions{display:flex;gap:8px}.actions button,.overlay button{border:1px solid #46536a;background:#182235;color:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}.stage{position:relative;flex:1;min-height:0;border:1px solid #27334a;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#101b30,#080c16);box-shadow:0 20px 70px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#050811c9;backdrop-filter:blur(5px);text-align:center;padding:20px}.overlay[hidden]{display:none}.panel{max-width:390px}.panel h1{font-size:clamp(28px,7vw,46px);margin:0 0 8px}.panel p{color:#b8c3d5;line-height:1.55}.overlay button{background:#7c5cff;border:0;padding:12px 24px;font-size:15px}.hint{text-align:center;color:#7f8ba0;font-size:12px}.touch-hint{display:none}@media(pointer:coarse){.touch-hint{display:inline}.desktop-hint{display:none}}@media(max-height:560px){main{padding:8px;gap:7px}.top{min-height:32px}.stats{font-size:11px}.stats b{font-size:14px}.hint{font-size:10px}}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand">BRICK BREAKER</div><div class="stats"><div>SCORE<b id="score">0</b></div><div>BEST<b id="best">0</b></div><div>LIVES<b id="lives">3</b></div></div><div class="actions"><button id="pause" type="button">Pause</button><button id="restart" type="button">Restart</button></div></header>
<section class="stage"><canvas id="game" aria-label="Brick Breaker game"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="heading">Brick Breaker</h1><p id="message">Move the paddle to bounce the ball and clear every brick. Use your mouse, touch, or the arrow keys.</p><button id="start" type="button">Start game</button></div></div></section>
<div class="hint"><span class="desktop-hint">Move with ← → or A / D · Space to launch · P to pause</span><span class="touch-hint">Drag anywhere in the playfield to move · Tap to launch</span></div>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const colors=['#ff647c','#ffad5c','#ffe16a','#66d9a8','#5fc8ff','#a58aff'];
let w=0,h=0,dpr=1,bricks=[],score=0,lives=3,best=Number(localStorage.getItem('excruciating-brick-best')||0),running=false,paused=false,started=false,raf=0,last=0;
const paddle={x:0,y:0,w:112,h:13,speed:8},ball={x:0,y:0,r:7,vx:3.4,vy:-4.6,stuck:true};
const keys={left:false,right:false};
$('best').textContent=best;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paddle.w=Math.min(120,Math.max(82,w*.19));paddle.y=h-34;paddle.x=(w-paddle.w)/2;if(ball.stuck)placeBall();draw();}
function placeBall(){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;}
function makeBricks(){bricks=[];const cols=Math.max(5,Math.min(10,Math.floor((w-30)/67))),gap=7,margin=15,bw=(w-margin*2-gap*(cols-1))/cols,bh=19,rows=Math.min(6,Math.max(4,Math.floor(h/95)));for(let row=0;row<rows;row++)for(let col=0;col<cols;col++)bricks.push({x:margin+col*(bw+gap),y:45+row*(bh+gap),w:bw,h:bh,hp:row<2?2:1,color:colors[row%colors.length],alive:true});}
function updateHud(){$('score').textContent=score;$('lives').textContent=lives;$('best').textContent=best;}
function reset(){score=0;lives=3;ball.vx=3.4;ball.vy=-4.6;ball.stuck=true;started=false;paused=false;running=false;paddle.x=(w-paddle.w)/2;placeBall();makeBricks();updateHud();$('pause').textContent='Pause';showOverlay('Brick Breaker','Move the paddle to bounce the ball and clear every brick. Use your mouse, touch, or the arrow keys.','Start game');draw();}
function showOverlay(title,msg,button){$('heading').textContent=title;$('message').textContent=msg;$('start').textContent=button;$('overlay').hidden=false;}
function launch(){if(lives<=0)reset();if(!started){started=true;running=true;$('overlay').hidden=true;}if(ball.stuck){ball.stuck=false;ball.vx=(Math.random()-.5)*3.5;ball.vy=-Math.max(4.4,Math.abs(ball.vy));}}
function movePaddle(x){paddle.x=Math.max(0,Math.min(w-paddle.w,x-paddle.w/2));if(ball.stuck)placeBall();}
function tick(t){raf=requestAnimationFrame(tick);if(!running||paused)return;const dt=Math.min((t-last)/16.67||1,2);last=t;
if(keys.left)paddle.x=Math.max(0,paddle.x-paddle.speed*dt);if(keys.right)paddle.x=Math.min(w-paddle.w,paddle.x+paddle.speed*dt);if(ball.stuck)placeBall();else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>w-ball.r){ball.x=w-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.4;ball.vy=-Math.max(3.8,Math.sqrt(Math.max(10,ball.vx*ball.vx+ball.vy*ball.vy-ball.vx*ball.vx)));ball.y=paddle.y-ball.r;}
for(const b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp--;if(!b.hp)b.alive=false;ball.vy*=-1;score+=10;if(score>best){best=score;localStorage.setItem('excruciating-brick-best',best)}updateHud();break;}}
if(ball.y>h+ball.r){lives--;updateHud();if(lives<=0){running=false;showOverlay('Game over','You scored '+score+' points. Best score: '+best+'.','Play again');}else{ball.stuck=true;ball.vx*=.9;ball.vy=-Math.abs(ball.vy);placeBall();}}
if(bricks.every(b=>!b.alive)){makeBricks();ball.vx*=1.08;ball.vy*=1.08;score+=100;updateHud();}}
draw();}
function draw(){ctx.clearRect(0,0,w,h);ctx.save();ctx.globalAlpha=.22;for(let x=0;x<w;x+=32){ctx.strokeStyle='#34435f';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}ctx.restore();
for(const b of bricks){if(!b.alive)continue;ctx.fillStyle=b.color;ctx.globalAlpha=b.hp===1?1:.55;roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.globalAlpha=.17;roundRect(b.x+3,b.y+2,b.w-6,3,2);ctx.fill();ctx.globalAlpha=1;}
ctx.shadowColor='#8b75ff';ctx.shadowBlur=18;ctx.fillStyle='#b6a7ff';roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.shadowBlur=0;
ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore();}
function roundRect(x,y,width,height,r){ctx.beginPath();ctx.roundRect(x,y,width,height,r);}
$('start').addEventListener('click',launch);$('restart').addEventListener('click',reset);$('pause').addEventListener('click',()=>{if(!started)return;paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(paused)showOverlay('Paused','Take a breather. Your game is waiting.','Resume');else $('overlay').hidden=true;});
$('start').addEventListener('click',()=>{if(paused){paused=false;$('pause').textContent='Pause';}});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' '||e.key==='Enter')launch();if(e.key.toLowerCase()==='p')$('pause').click();});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();movePaddle(e.clientX-r.left);});canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();movePaddle(e.clientX-r.left);if(!started||ball.stuck)launch();});
window.addEventListener('blur',()=>{keys.left=keys.right=false;});
new ResizeObserver(resize).observe(canvas);resize();makeBricks();reset();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
