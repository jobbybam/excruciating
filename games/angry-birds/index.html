<!DOCTYPE>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Simple Angry Birds</title>
		<script type="text/javascript" src='js/box2d.js'></script> 
        <script type="text/javascript" src="js/cocos2d.js" ></script>
        <style type="text/css">
            * { box-sizing: border-box; margin: 0; padding: 0; }
            html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
            body { display: grid; place-items: center; }
            #viewport { display: block; width: min(100vw, 200dvh); height: min(50vw, 100dvh); touch-action: none; }
        </style>
    </head> 
    <body>
        <canvas id="viewport" width="1200" height="600" >
            <h2 style="text-align:center">Use a better browser !</h2>
        </canvas>
    </body>
</html>
