    <script>
      window.rWS = WebSocket;
      WebSocket = function (url, options) {
        var split = url.split("://");
        var prefix = "";
        if (!url.includes("arc.io")) {
          switch (split[0].toLowerCase()) {
            case "ws":
              prefix = "wss://onebigorange-tmm.tbt.mx/websocket/http://";
              break;
            case "wss":
              prefix = "wss://onebigorange-tmm.tbt.mx/websocket/https://";
              break;
            default:
              prefix = split[0];
          }
          return new (Function.prototype.bind.call(window.rWS, null, (split[1].match(/\//g) || []).length === 0 ? (split[1].includes("?") ? prefix + split[1].replace("?", "/?") : prefix + split[1] + "/") : prefix + split[1], options))();
        } else {
          return new window.rWS(url, options);
        }
      };
      var origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (...args) {
        if (!args[1].includes("arc.io")) args[1] = /^http/.test(args[1]) ? "https://onebigstatic-tmm.tbt.mx/static/" + args[1] : args[1];
        origOpen.apply(this, args);
      };
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope_27Sept.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            UnityProgress(gameInstance, "complete");
          },
        },
      });
    </script>

    <style>
      #slope-mobile-controls {
        display: none;
      }
      @media (pointer: coarse), (max-width: 800px) {
        #slope-mobile-controls {
          position: fixed;
          inset: auto 0 max(22px, env(safe-area-inset-bottom)) 0;
          z-index: 100000;
          display: flex;
          justify-content: space-between;
          align-items: end;
          padding: 0 22px;
          pointer-events: none;
          box-sizing: border-box;
        }
        #slope-mobile-controls button {
          pointer-events: auto;
          width: 76px;
          height: 76px;
          border: 2px solid rgba(255,255,255,.7);
          border-radius: 18px;
          background: rgba(12,16,25,.62);
          color: #fff;
          font: 800 21px/1 system-ui, sans-serif;
          text-shadow: 0 1px 3px #000;
          -webkit-tap-highlight-color: transparent;
          touch-action: none;
          user-select: none;
        }
        #slope-mobile-controls button:active,
        #slope-mobile-controls button.pressed {
          background: rgba(255,255,255,.32);
          transform: scale(.96);
        }
      }
    </style>
    <div id="slope-mobile-controls" aria-label="Slope mobile controls">
      <button type="button" data-key="a" aria-label="Steer left">◀ A</button>
      <button type="button" data-key="d" aria-label="Steer right">D ▶</button>
    </div>
    <script>
      (() => {
        const controls = document.getElementById("slope-mobile-controls");
        if (!controls) return;
        const held = new Set();
        const keyEvent = (type, key) => {
          const code = key.toUpperCase();
          const event = new KeyboardEvent(type, {
            key, code: "Key" + code, bubbles: true, cancelable: true
          });
          const legacyCode = key === "a" ? 65 : 68;
          Object.defineProperty(event, "keyCode", { get: () => legacyCode });
          Object.defineProperty(event, "which", { get: () => legacyCode });
          Object.defineProperty(event, "charCode", { get: () => 0 });
          document.dispatchEvent(event);
          // Also emit the matching arrow key for builds that steer with arrows.
          const arrow = key === "a" ? "ArrowLeft" : "ArrowRight";
          const arrowEvent = new KeyboardEvent(type, {
            key: arrow, code: arrow, bubbles: true, cancelable: true
          });
          const arrowCode = key === "a" ? 37 : 39;
          Object.defineProperty(arrowEvent, "keyCode", { get: () => arrowCode });
          Object.defineProperty(arrowEvent, "which", { get: () => arrowCode });
          document.dispatchEvent(arrowEvent);
        };
        const release = (button) => {
          const key = button.dataset.key;
          if (!held.has(key)) return;
          held.delete(key);
          button.classList.remove("pressed");
          keyEvent("keyup", key);
        };
        controls.querySelectorAll("button").forEach((button) => {
          const key = button.dataset.key;
          button.addEventListener("contextmenu", event => event.preventDefault());
          button.addEventListener("pointerdown", event => {
            event.preventDefault();
            if (held.has(key)) return;
            held.add(key);
            button.classList.add("pressed");
            try { button.setPointerCapture(event.pointerId); } catch (_) {}
            keyEvent("keydown", key);
          });
          ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
            button.addEventListener(type, () => release(button));
          });
        });
        window.addEventListener("blur", () => {
          controls.querySelectorAll("button").forEach(release);
        });
      })();
    </script>
