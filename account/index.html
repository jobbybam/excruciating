<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Account · excruciating</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/app-icon-180.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/account.js" defer></script>
</head>
<body class="account-page">
  <header class="topbar account-topbar">
    <a class="wordmark" href="/" aria-label="excruciating home">excruciating</a>
    <a id="account-back-link" class="secondary-button" href="/">Back to games</a>
  </header>
  <main class="account-shell">
    <section id="account-auth-section" class="account-card account-auth-card">
      <p class="eyebrow">EXCRUCIATING ACCOUNT</p>
      <h1 id="account-auth-heading">Welcome back</h1>
      <p class="account-copy">Sign in to chat, send direct messages, and manage your account.</p>
      <form id="account-auth-form">
        <label for="account-auth-username">Username</label>
        <input id="account-auth-username" class="chat-input" name="username" maxlength="20" minlength="3" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" required>
        <label for="account-auth-password">Password</label>
        <input id="account-auth-password" class="chat-input" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" placeholder="Password" required>
        <button id="account-auth-submit" class="primary-button" type="submit">Log in</button>
        <button id="account-auth-switch" class="text-button" type="button">Need an account? Register</button>
        <p id="account-auth-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="account-manager" hidden>
      <div class="account-page-heading">
        <p class="eyebrow">YOUR ACCOUNT</p>
        <h1>Manage account</h1>
        <p id="account-welcome" class="account-copy"></p>
      </div>
      <section class="account-card">
        <h2>Username</h2>
        <p class="account-copy">You can change your username once every 3 days.</p>
        <form id="username-change-form">
          <label for="account-new-username">Username</label>
          <input id="account-new-username" class="chat-input" maxlength="20" minlength="3" pattern="[A-Za-z0-9_]{3,20}" autocomplete="off" autocapitalize="none" spellcheck="false" required>
          <p id="username-change-help" class="form-hint" role="status"></p>
          <button id="username-change-submit" class="primary-button" type="submit">Save username</button>
          <p id="username-change-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="account-card account-access-card">
        <div><h2>Account access</h2><p class="account-copy">Sign out of this browser.</p></div>
        <button id="account-logout" class="secondary-button" type="button">Log out</button>
        <p id="account-logout-status" class="form-status" role="status"></p>
      </section>
    </section>
  </main>
</body>
</html>
