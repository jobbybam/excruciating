name: Import requested 3kh0 games
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-3kh0-games.yml"
permissions:
  contents: write
concurrency:
  group: excruciating-game-imports
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            catalog/games.json
            games/bitlife
            games/geodash
            games/happywheels
            games/jetpack-joyride
            games/motox3m
            games/motox3m-pool
            games/motox3m-spooky
            games/motox3m-winter
            games/google-snake
            games/draw-the-hill
            games/chrome-dino
            games/eggycar
            games/stack
            games/snowrider3d
            games/temple-run-2
            games/monster-tracks
            games/ovo
            games/rooftop-snipers
            games/slope
            games/yohoho
            games/eaglerfaithful
            games/polytrack
          sparse-checkout-cone-mode: false
      - name: Clone only the requested 3kh0 GitLab game folders
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --no-checkout https://gitlab.com/3kh0/3kh0-assets.git /tmp/3kh0-assets
          git -C /tmp/3kh0-assets sparse-checkout init --cone
          git -C /tmp/3kh0-assets sparse-checkout set bitlife geodash happywheels jetpack-joyride motox3m motox3m-pool motox3m-spooky motox3m-winter google-snake draw-the-hill chrome-dino eggycar stack snowrider3d temple-run-2 monster-tracks ovo rooftop-snipers slope yohoho eaglerfaithful
          git -C /tmp/3kh0-assets checkout
      - name: Clone the permitted PolyTrack reupload source
        run: git clone --depth 1 https://github.com/itjey/polytrack.git /tmp/polytrack
      - name: Import only requested game folders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil, re
          from pathlib import Path
          source = Path("/tmp/3kh0-assets")
          target = Path("games")
          requested = [
            ("bitlife", "BitLife", "Simulation"),
            ("geodash", "Geometry Dash", "Arcade"),
            ("happywheels", "Happy Wheels", "Action"),
            ("jetpack-joyride", "Jetpack Joyride", "Arcade"),
            ("motox3m", "Moto X3M", "Racing"),
            ("motox3m-pool", "Moto X3M Pool Party", "Racing"),
            ("motox3m-spooky", "Moto X3M Spooky Land", "Racing"),
            ("motox3m-winter", "Moto X3M Winter", "Racing"),
            ("google-snake", "Google Snake", "Arcade"),
            ("draw-the-hill", "Draw the Hill", "Arcade"),
            ("chrome-dino", "Chrome Dino", "Arcade"),
            ("eggycar", "Eggy Car", "Racing"),
            ("stack", "Stack", "Arcade"),
            ("snowrider3d", "Snow Rider 3D", "Racing"),
            ("temple-run-2", "Temple Run 2", "Arcade"),
            ("monster-tracks", "Monster Tracks", "Racing"),
            ("ovo", "OvO", "Platformer"),
            ("rooftop-snipers", "Rooftop Snipers", "Action"),
            ("slope", "Slope", "Arcade"),
            ("yohoho", "Yohoho.io", "Multiplayer"),
            ("eaglerfaithful", "Eaglercraft", "Multiplayer"),
          ]
          catalogue_path = Path("catalog/games.json")
          catalogue = json.loads(catalogue_path.read_text(encoding="utf-8"))
          entries = {g["slug"]: g for g in catalogue["games"]}
          imported = []
          for folder, title, category in requested:
              src = source / folder
              if not src.is_dir():
                  print(f"Not in upstream GitLab tree; skipping: {folder}")
                  continue
              if not (src / "index.html").is_file():
                  print(f"No root index.html; skipping: {folder}")
                  continue
              dest = target / folder
              if not (dest / "index.html").is_file():
                  if dest.exists(): shutil.rmtree(dest)
                  shutil.copytree(src, dest, ignore=shutil.ignore_patterns(".git", ".github", "node_modules"))
              else:
                  print(f"Keeping existing locally hosted game: {title}")
              files = [p for p in dest.rglob("*") if p.is_file()]
              oversized = [p for p in files if p.stat().st_size > 25 * 1024 * 1024]
              if oversized: raise SystemExit(f"{title}: file exceeds Cloudflare Pages 25 MiB limit: {oversized[0]}")
              for html in dest.rglob("*.html"):
                  try: content = html.read_text(encoding="utf-8")
                  except UnicodeDecodeError: continue
                  content = content.replace(f"https://raw.githack.com/3kh0/3kh0-assets/main/{folder}/", f"/games/{folder}/")
                  content = content.replace(f"https://raw.githubusercontent.com/3kh0/3kh0-assets/main/{folder}/", f"/games/{folder}/")
                  if folder.startswith("motox3m"):
                      content = re.sub(r'<script\b[^>]*(?:gamebridge\.js|pk-sdk\.js|imasdk\.googleapis\.com)[^>]*>.*?</script\s*>', '', content, flags=re.I|re.S)
                  content = re.sub(r'<script\b[^>]*src=["\']/js/main\.js["\'][^>]*>\s*</script\s*>', '', content, flags=re.I)
                  html.write_text(content, encoding="utf-8")
              index_page = dest / "index.html"
              page_html = index_page.read_text(encoding="utf-8")
              credit = """
              <div id="excruciating-3kh0-credit">Game files from <a href="https://gitlab.com/3kh0/3kh0-assets" target="_blank" rel="noopener noreferrer">3kh0 Assets</a></div>
              <style>#excruciating-3kh0-credit{position:fixed;right:8px;bottom:6px;z-index:99998;padding:4px 7px;border-radius:5px;background:rgba(0,0,0,.65);color:#fff;font:10px/1.3 system-ui,sans-serif;opacity:.7}#excruciating-3kh0-credit a{color:inherit;text-decoration:underline}</style>
              """
              if "excruciating-3kh0-credit" not in page_html:
                  page_html = page_html.replace("</body>", credit + chr(10) + "</body>")
              index_page.write_text(page_html, encoding="utf-8")
              attribution = chr(10).join([
                  "# Attribution",
                  "",
                  "Game files sourced from the 3kh0 Assets collection. Please credit 3kh0. Original game names, trademarks and third-party game rights remain with their respective creators.",
                  "",
                  "Source: https://gitlab.com/3kh0/3kh0-assets",
                  ""
              ])
              (dest / "ATTRIBUTION.md").write_text(attribution, encoding="utf-8")
              if folder.startswith("motox3m"):
                  for sdk in ("gamebridge.js", "pk-sdk.js"):
                      if (dest / sdk).exists(): (dest / sdk).unlink()
              thumbnail = next((f"/games/{folder}/{name}" for name in ("splash.jpg", "thumbnail.png", "thumb.png", "favicon.png", "favicon.ico") if (dest / name).is_file()), f"/games/{folder}/favicon.svg")
              entries[folder] = {
                "slug":folder,"title":title,"category":category,
                "description":"Locally hosted game imported from the 3kh0 assets collection.",
                "url":f"/games/{folder}/index.html",
                "thumbnail":thumbnail,
                "source_url":"https://gitlab.com/3kh0/3kh0-assets",
                "license":"3kh0 Assets README requests attribution; third-party game rights vary by title.",
                "attribution":"Sourced from the 3kh0 assets collection. Credit to 3kh0; original game rights belong to their respective creators.",
                "published":True
              }
              imported.append(title)
          # PolyTrack is not in 3kh0; its creator's terms expressly permit non-commercial reuploads when the required notices and official link are preserved.
          poly_source = Path("/tmp/polytrack")
          poly_dest = target / "polytrack"
          if not (poly_source / "index.html").is_file():
              raise SystemExit("PolyTrack source is missing its root index.html.")
          if not (poly_dest / "index.html").is_file():
              if poly_dest.exists(): shutil.rmtree(poly_dest)
              shutil.copytree(poly_source, poly_dest, ignore=shutil.ignore_patterns(".git", ".github", "node_modules"))
          else:
              print("Keeping existing locally hosted game: PolyTrack")
          oversized = [p for p in poly_dest.rglob("*") if p.is_file() and p.stat().st_size > 25 * 1024 * 1024]
          if oversized: raise SystemExit(f"PolyTrack file exceeds Cloudflare Pages 25 MiB limit: {oversized[0]}")
          poly_index = poly_dest / "index.html"
          poly_html = poly_index.read_text(encoding="utf-8")
          config = '<script>window.polytrackModConfiguration = { unblocked: true };</script>'
          if "polytrackModConfiguration" not in poly_html:
              poly_html = poly_html.replace("</head>", "  " + config + chr(10) + "</head>")
          notice = """
          <div id="excruciating-polytrack-notice">Unofficial, non-commercial PolyTrack reupload by Excruciating. Not affiliated with or endorsed by Kodub.com, CrazyGames, Poki or itch.io. Original game by Kodub. <a href="https://www.crazygames.com/game/polytrack" target="_blank" rel="noopener noreferrer">Official PolyTrack on CrazyGames</a>.</div>
          <style>#excruciating-polytrack-notice{position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:6px 10px;background:rgba(0,0,0,.78);color:#fff;font:12px/1.4 system-ui,sans-serif;text-align:center}#excruciating-polytrack-notice a{color:#fff;text-decoration:underline}</style>
          """
          if "excruciating-polytrack-notice" not in poly_html:
              poly_html = poly_html.replace("</body>", notice + chr(10) + "</body>")
          poly_index.write_text(poly_html, encoding="utf-8")
          attribution = chr(10).join([
              "# PolyTrack",
              "",
              "Original game © Kodub. This is an unofficial, non-commercial reupload.",
              "",
              "The reupload follows Kodub's terms: preserve the in-game unrecognized-domain notice and outbound links, show the unofficial notice, credit Kodub, and link to the official CrazyGames game page.",
              "",
              "Terms: https://www.kodub.com/terms/polytrack",
              "Source used for this local copy: https://github.com/itjey/polytrack",
              ""
          ])
          (poly_dest / "ATTRIBUTION.md").write_text(attribution, encoding="utf-8")
          entries["polytrack"] = {
            "slug":"polytrack","title":"PolyTrack","category":"Racing",
            "description":"Locally hosted non-commercial PolyTrack reupload with Kodub's required notices and official link.",
            "url":"/games/polytrack/index.html",
            "source_url":"https://github.com/itjey/polytrack",
            "license":"Reupload permitted subject to Kodub's PolyTrack Terms of Service.",
            "attribution":"PolyTrack © Kodub. Unofficial non-commercial reupload; official game link and required notice are preserved.",
            "published":True
          }
          imported.append("PolyTrack")
          if not imported: raise SystemExit("No requested games were imported; nothing was committed.")
          catalogue["games"] = list(entries.values())
          catalogue["version"] = int(catalogue.get("version",1)) + 1
          catalogue["source"] = "Locally hosted selected 3kh0 games from GitLab."
          catalogue_path.write_text(json.dumps(catalogue,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Imported:", ", ".join(imported))
          PY
      - name: Commit and push imported games
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/games.json
          for folder in bitlife geodash happywheels jetpack-joyride motox3m motox3m-pool motox3m-spooky motox3m-winter google-snake draw-the-hill chrome-dino eggycar stack snowrider3d temple-run-2 monster-tracks ovo rooftop-snipers slope yohoho eaglerfaithful polytrack; do
            if [ -d "games/$folder" ]; then git add "games/$folder"; fi
          done
          git commit -m "Add requested locally hosted 3kh0 games" || echo "No catalogue or game changes to commit."
          git fetch origin main
          if ! git rebase origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            for path in $conflicts; do
              case "$path" in
                games/*/index.html)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected import conflict: $path"
                  git rebase --abort
                  exit 1
                  ;;
              esac
            done
            GIT_EDITOR=true git rebase --continue
          fi
          git push
