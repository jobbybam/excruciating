name: Import and build Ballistic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ballistic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-ballistic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Excruciating
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch and build the licensed Ballistic source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/xtreemze/Ballistic.git /tmp/Ballistic
          cd /tmp/Ballistic
          npm install --ignore-scripts
          npm run check
          npm run build
          test -s dist/index.html
          test -s dist/js/master.js
          cd "$GITHUB_WORKSPACE"

          rm -rf games/ballistic
          mkdir -p games/ballistic/SOURCE
          cp -a /tmp/Ballistic/dist/. games/ballistic/

          # Include the corresponding source, build recipe, package metadata
          # and the upstream AGPL-3.0 text with the hosted build.
          cp /tmp/Ballistic/LICENSE games/ballistic/LICENSE
          cp /tmp/Ballistic/README.md games/ballistic/README-upstream.md
          cp /tmp/Ballistic/package.json games/ballistic/SOURCE/package.json
          cp /tmp/Ballistic/index.html games/ballistic/SOURCE/index.html
          cp /tmp/Ballistic/tools/build.mjs games/ballistic/SOURCE/build.mjs
          cp /tmp/Ballistic/tools/check.mjs games/ballistic/SOURCE/check.mjs
          mkdir -p games/ballistic/SOURCE/js games/ballistic/SOURCE/audio
          cp /tmp/Ballistic/js/master.js games/ballistic/SOURCE/js/
          cp /tmp/Ballistic/js/desktop-controls.js games/ballistic/SOURCE/js/
          cp /tmp/Ballistic/js/register-service-worker.js games/ballistic/SOURCE/js/
          cp /tmp/Ballistic/audio/ambient_mixdown.mp3 games/ballistic/SOURCE/audio/
          cp /tmp/Ballistic/audio/whoosh_mixdown.mp3 games/ballistic/SOURCE/audio/
          cp /tmp/Ballistic/audio/thud_mixdown.mp3 games/ballistic/SOURCE/audio/

          cat > games/ballistic/ATTRIBUTION.md <<'NOTICE'
          # Ballistic

          Original project: https://github.com/xtreemze/Ballistic
          Author: Carlos Velasco (xtreemze)
          Licence: GNU Affero General Public License, version 3 (AGPL-3.0).

          This local copy is built from the upstream production build. The upstream
          licence, README, build recipe, and corresponding game source files are
          included in this folder. The game has not been rebranded as an original
          Excruciating game.
          NOTICE

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("catalog/games.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          game = next((g for g in data["games"] if g["slug"] == "ballistic"), None)
          if not game:
              raise SystemExit("Ballistic catalogue entry is missing.")
          if not (Path("games/ballistic/index.html").is_file() and Path("games/ballistic/LICENSE").is_file()):
              raise SystemExit("Ballistic production build or licence is missing.")
          game["url"] = "/games/ballistic/index.html"
          game["published"] = True
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Check file sizes and commit the local game
        shell: bash
        run: |
          set -euo pipefail
          oversized=$(find games/ballistic -type f -size +25M -print)
          if [ -n "$oversized" ]; then
            echo "Ballistic contains files over Cloudflare Pages' 25 MiB per-asset limit:"
            echo "$oversized"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/ballistic catalog/games.json
          git commit -m "Add self-hosted Ballistic game and AGPL source"
          git push
