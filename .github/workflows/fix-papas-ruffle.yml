name: Fix Papa's Games Ruffle loader
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-papas-ruffle.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and validate Ruffle on every hosted Papa's game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pages = sorted(Path("games").glob("papas-*/index.html"))
          if len(pages) != 14:
              raise SystemExit(f"Expected 14 Papa's game pages, found {len(pages)}")
          for page in pages:
              html = page.read_text(encoding="utf-8")
              html = html.replace(
                  'await player.ruffle().load(new URL("./game.swf", window.location.href).href);',
                  'await player.load({ url: new URL("./game.swf", window.location.href).href });'
              )
              html = html.replace(
                  'await player.load(new URL("./game.swf", window.location.href).href);',
                  'await player.load({ url: new URL("./game.swf", window.location.href).href });'
              )
              if 'await player.load({ url: new URL("./game.swf", window.location.href).href });' not in html:
                  raise SystemExit(f"Unsupported or missing Ruffle load call in {page}")
              if 'publicPath: new URL("/games/ruffle/", window.location.origin).href' not in html:
                  raise SystemExit(f"Ruffle publicPath is incorrect in {page}")
              page.write_text(html, encoding="utf-8")
          ruffle = Path("games/ruffle")
          js = ruffle / "ruffle.js"
          if not js.is_file() or js.stat().st_size < 100000:
              raise SystemExit("Missing or invalid local ruffle.js")
          js_text = js.read_text(encoding="utf-8")
          wasm_names = ["878d548199cddef07035.wasm", "172de42e6619eac8f371.wasm"]
          if not all(name in js_text for name in wasm_names):
              raise SystemExit("Ruffle JS references unexpected or missing WASM files")
          for name in wasm_names:
              wasm = ruffle / name
              if not wasm.is_file() or wasm.stat().st_size < 1024:
                  raise SystemExit(f"Missing local Ruffle WASM file: {name}")
          print(f"Validated {len(pages)} Papa's pages and {len(wasm_names)} local Ruffle WASM binaries.")
          PY
      - name: Commit and push fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/papas-*/index.html
          git commit -m "Fix Papa's games Ruffle loading" || echo "No changes required."
          git fetch origin main
          git rebase origin/main
          git push
