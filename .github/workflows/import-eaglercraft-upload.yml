name: Import EaglercraftX 1.8 mobile client

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-eaglercraft-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: excruciating-eaglercraft-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch EaglercraftX 1.8 from the supplied repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/eaglercraftx1-8/eaglercraftx1-8.github.io.git /tmp/eaglercraft
          git -C /tmp/eaglercraft sparse-checkout set eagler-files/1.8/Main
          git -C /tmp/eaglercraft checkout
          test -s /tmp/eaglercraft/eagler-files/1.8/Main/index.html
          test -s /tmp/eaglercraft/eagler-files/1.8/Main/classes.js
          test -s /tmp/eaglercraft/eagler-files/1.8/Main/assets.epk
          rm -rf games/eaglerfaithful
          mkdir -p games/eaglerfaithful
          rsync -a --delete /tmp/eaglercraft/eagler-files/1.8/Main/ games/eaglerfaithful/
      - name: Remove upstream analytics and set the mobile viewport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path("games/eaglerfaithful/index.html")
          html = page.read_text(encoding="utf-8")
          html = re.sub(r'<script\b[^>]*src=["\']/js/ga4\.js["\'][^>]*>\s*</script\s*>', "", html, flags=re.I)
          mobile = """
          <style id="excruciating-eagler-mobile">
            html,body,#game_frame{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none}
            #game_frame canvas{touch-action:none;-webkit-user-select:none;user-select:none}
          </style>
          """
          if "excruciating-eagler-mobile" not in html:
              html = html.replace("</head>", mobile + "\n</head>", 1)
          page.write_text(html, encoding="utf-8")
          Path("games/eaglerfaithful/ATTRIBUTION.md").write_text(
              "# EaglercraftX 1.8\n\n"
              "Client files are sourced from the EaglercraftX Client Collections repository, directory eagler-files/1.8/Main. The source repository README requests credit. Eaglercraft is unofficial; Minecraft is a trademark of Mojang/Microsoft.\n\n"
              "Source: https://github.com/eaglercraftx1-8/eaglercraftx1-8.github.io/tree/main/eagler-files/1.8/Main\n",
              encoding="utf-8"
          )
          PY
      - name: Validate local client assets and Cloudflare Pages file limits
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html classes.js assets.epk favicon.png; do
            test -s "games/eaglerfaithful/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          root = Path("games/eaglerfaithful")
          maximum = 25 * 1024 * 1024
          oversized = [p for p in root.rglob("*") if p.is_file() and p.stat().st_size > maximum]
          if oversized:
              raise SystemExit("Eaglercraft contains a file over the 25 MiB Pages limit: " + str(oversized[0]))
          html = (root / "index.html").read_text(encoding="utf-8")
          if "/js/ga4.js" in html or "https://cdnjs.cloudflare.com" in html:
              raise SystemExit("An external analytics or library dependency remains.")
          if "eaglercraftXOpts" not in html or "classes.js" not in html:
              raise SystemExit("The upstream EaglercraftX 1.8 launch configuration is incomplete.")
          PY
      - name: Update the catalogue entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("catalog/games.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entries = [g for g in data.get("games", []) if g.get("slug") not in {"eaglercraft", "eaglerfaithful"}]
          entries.append({
            "slug": "eaglerfaithful",
            "title": "EaglercraftX 1.8",
            "category": "Multiplayer",
            "description": "EaglercraftX 1.8 with its touchscreen mode and Excruciating's iPad joystick, look surface and action controls.",
            "url": "/games/eaglerfaithful/index.html",
            "thumbnail": "/games/eaglerfaithful/favicon.png",
            "icon": "/games/eaglerfaithful/favicon.png",
            "source_url": "https://github.com/eaglercraftx1-8/eaglercraftx1-8.github.io/tree/main/eagler-files/1.8/Main",
            "license": "The upstream repository requests credit; third-party game rights remain with their respective owners.",
            "attribution": "EaglercraftX Client Collections. Unofficial Minecraft browser client.",
            "published": True
          })
          data["games"] = entries
          data["version"] = int(data.get("version", 1)) + 1
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit the selected Eaglercraft client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games/eaglerfaithful catalog/games.json
          git commit -m "Replace Eaglercraft with mobile-ready EaglercraftX 1.8"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
