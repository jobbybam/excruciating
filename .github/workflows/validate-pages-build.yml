name: Validate Cloudflare Pages build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check site JavaScript syntax
        run: |
          node --check app.js
          node --check account.js
          node --check game-shell.js
          node --check ruffle-game.js
          node --check scripts/prepare-pages.mjs
          npm test
      - name: Build static Pages output
        run: npm run build
      - name: Verify asset limits and published game pages
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path(".")
          dist = root / "dist"
          max_bytes = 25 * 1024 * 1024
          oversized = [str(p.relative_to(dist)) for p in dist.rglob("*")
                       if p.is_file() and p.stat().st_size > max_bytes]
          if oversized:
              raise SystemExit("Assets exceed Cloudflare Pages 25 MiB limit:\n" + "\n".join(oversized))
          if (dist / "tests").exists():
              raise SystemExit("Test source files must not be copied into the public Pages output.")

          wasm_files = list((dist / "games/ruffle").glob("*.wasm"))
          if not wasm_files:
              raise SystemExit("No locally hosted Ruffle WASM binaries were copied to dist.")
          for wasm in wasm_files:
              with wasm.open("rb") as stream:
                  if stream.read(4) != b"\x00asm":
                      raise SystemExit(f"Invalid WebAssembly file: {wasm}")

          ruffle_js = (dist / "games/ruffle/ruffle.js").read_text(encoding="utf-8")
          referenced = set(re.findall(r'a\.p\+"([a-f0-9]+\.wasm)"', ruffle_js))
          available = {p.name for p in wasm_files}
          if not referenced or not referenced.issubset(available):
              raise SystemExit(f"Ruffle WASM mismatch. Referenced={sorted(referenced)}, available={sorted(available)}")

          chunk_map = re.search(r'"core\.ruffle\."\+\{([^}]+)\}\[e\]\+"\.js"', ruffle_js)
          if not chunk_map:
              raise SystemExit("Ruffle loader does not declare its local core chunks.")
          chunk_hashes = re.findall(r'\d+:"([a-f0-9]+)"', chunk_map.group(1))
          if not chunk_hashes:
              raise SystemExit("Ruffle loader core chunk map is empty.")
          for digest in chunk_hashes:
              chunk = dist / "games/ruffle" / f"core.ruffle.{digest}.js"
              if not chunk.is_file():
                  raise SystemExit(f"Missing local Ruffle core chunk: {chunk.name}")

          headers = (dist / "_headers").read_text(encoding="utf-8")
          if "Content-Type: application/wasm" not in headers:
              raise SystemExit("Missing Ruffle WebAssembly MIME header in Pages output.")

          middleware = (root / "functions/_middleware.js").read_text(encoding="utf-8")
          if "new HTMLRewriter()" not in middleware or "/game-shell.js" not in middleware:
              raise SystemExit("Pages middleware does not inject the shared mobile game shell.")

          game_pages = list((dist / "games").glob("*/index.html"))
          for page in game_pages:
              html = page.read_text(encoding="utf-8")
              viewport = re.search(r'<meta\b(?=[^>]*\bname=["\']viewport["\'])(?=[^>]*\bcontent=["\'][^"\']*width=device-width[^"\']*["\'])[^>]*>', html, re.I)
              if not viewport:
                  raise SystemExit(f"Game page is missing a mobile viewport: {page}")
              icon = re.search(r'<link\b[^>]*\brel=["\'](?:shortcut\s+)?icon["\'][^>]*\bhref=["\']([^"\']+)["\']', html, re.I)
              if not icon:
                  raise SystemExit(f"Missing favicon link in {page}")
              href = icon.group(1)
              if href.startswith("http"):
                  raise SystemExit(f"External favicon is not allowed for {page}: {href}")
              icon_path = (dist / href.lstrip("/")) if href.startswith("/") else (page.parent / href)
              if not icon_path.is_file():
                  raise SystemExit(f"Favicon target does not exist for {page}: {href}")

          catalogue = json.loads((dist / "catalog/games.json").read_text(encoding="utf-8"))
          games = [game for game in catalogue.get("games", []) if game.get("published") is not False]
          if len({game.get("slug") for game in games}) != len(games):
              raise SystemExit("Catalogue contains duplicate game slugs.")

          local_games = {game["slug"] for game in games if str(game.get("url", "")).startswith("/games/")}
          external_games = {game["slug"] for game in games if game.get("external") is True}
          expected_external = {
              "krillion", "count-master", "wordle-unlimited", "stack", "idle-mining-empire",
              "bottle-flip", "cubes-2048-io", "helix-jump", "ballistic"
          }
          if external_games != expected_external:
              raise SystemExit(f"External game catalogue mismatch. Expected={sorted(expected_external)}, actual={sorted(external_games)}")

          if "deltarune" in local_games:
              source_index = (root / "games/deltarune/index.html").read_text(encoding="utf-8")
              deployed_index = (dist / "games/deltarune/index.html").read_text(encoding="utf-8")
              pattern = r"const deltaruneArchives\s*=\s*(\{[^\n]*\});"
              source_match = re.search(pattern, source_index)
              deployed_match = re.search(pattern, deployed_index)
              if not source_match or not deployed_match:
                  raise SystemExit("Could not read source or deployed Deltarune archive map.")
              source_map = json.loads(source_match.group(1))
              deployed_map = json.loads(deployed_match.group(1))
              for chapter, source_files in source_map.items():
                  deployed_files = deployed_map.get(chapter, [])
                  cursor = 0
                  for source_name in source_files:
                      source_path = root / "games/deltarune" / source_name
                      source_size = source_path.stat().st_size
                      if source_size <= max_bytes:
                          if cursor >= len(deployed_files) or deployed_files[cursor] != source_name:
                              raise SystemExit(f"Unexpected Deltarune deployment map entry for {source_name}")
                          cursor += 1
                          continue
                      prefix = source_name + ".pages-part"
                      pieces = []
                      while cursor < len(deployed_files) and deployed_files[cursor].startswith(prefix):
                          pieces.append(deployed_files[cursor])
                          cursor += 1
                      if len(pieces) < 2:
                          raise SystemExit(f"No split deployment pieces found for {source_name}")
                      expected_digest = hashlib.sha256(source_path.read_bytes()).digest()
                      combined_digest = hashlib.sha256()
                      total = 0
                      for piece in pieces:
                          piece_path = dist / "games/deltarune" / piece
                          if not piece_path.is_file() or piece_path.stat().st_size > max_bytes:
                              raise SystemExit(f"Missing or oversized Deltarune archive piece: {piece}")
                          data = piece_path.read_bytes()
                          total += len(data)
                          combined_digest.update(data)
                      if total != source_size or combined_digest.digest() != expected_digest:
                          raise SystemExit(f"Deltarune pieces do not rebuild the source bytes: {source_name}")
                  if cursor != len(deployed_files):
                      raise SystemExit(f"Unexpected extra Deltarune archive pieces for {chapter}")

          for slug in sorted(game for game in local_games if game.startswith("henry-")):
              source_swf = root / "games" / slug / "game.swf"
              deployed_dir = dist / "games" / slug
              deployed_swf = deployed_dir / "game.swf"
              manifest = deployed_dir / "game.swf.parts.json"
              page = deployed_dir / "index.html"
              if not source_swf.is_file() or not page.is_file():
                  raise SystemExit(f"Henry game files are missing: {slug}")
              html = page.read_text(encoding="utf-8")
              if "/ruffle-game.js" not in html or 'data-swf="game.swf"' not in html:
                  raise SystemExit(f"Henry page is not connected to the local Ruffle loader: {slug}")
              if source_swf.stat().st_size > max_bytes:
                  if deployed_swf.exists() or not manifest.is_file():
                      raise SystemExit(f"Oversized Henry SWF was not split for Cloudflare Pages: {slug}")
                  pieces = json.loads(manifest.read_text(encoding="utf-8"))
                  if len(pieces) < 2:
                      raise SystemExit(f"Henry SWF split manifest is incomplete: {slug}")
                  total = 0
                  digest = hashlib.sha256()
                  for piece in pieces:
                      piece_path = deployed_dir / piece
                      if not piece_path.is_file() or piece_path.stat().st_size > max_bytes:
                          raise SystemExit(f"Henry SWF split piece is missing or over the Pages limit: {slug}/{piece}")
                      data = piece_path.read_bytes()
                      total += len(data)
                      digest.update(data)
                  expected = hashlib.sha256(source_swf.read_bytes()).digest()
                  if total != source_swf.stat().st_size or digest.digest() != expected:
                      raise SystemExit(f"Henry split pieces do not rebuild source bytes: {slug}")
              elif not deployed_swf.is_file():
                  raise SystemExit(f"Henry SWF is missing from Pages output: {slug}")

          retired = {"angry-birds", "happywheels", "yohoho"}
          if any(game.get("slug") in retired for game in games):
              raise SystemExit("A removed game is still present in the public catalogue.")
          for game in games:
              url = game.get("url", "")
              if game.get("external") is True:
                  if not url.startswith("https://") or not str(game.get("thumbnail", "")).startswith("https://"):
                      raise SystemExit(f"External game must use HTTPS for its launch and thumbnail: {game.get('slug')}")
              elif not url.startswith("/games/") or not (dist / url.lstrip("/")).is_file():
                  raise SystemExit(f"Catalogue entry has no local launch page: {game.get('slug')}")

          expected_pages = {dist / "games" / slug / "index.html" for slug in local_games}
          game_pages = list((dist / "games").glob("*/index.html"))
          actual_pages = set(game_pages)
          if actual_pages != expected_pages:
              missing = sorted(str(path.relative_to(dist)) for path in expected_pages - actual_pages)
              unpublished = sorted(str(path.relative_to(dist)) for path in actual_pages - expected_pages)
              raise SystemExit(f"Game pages do not match the published local catalogue. Missing={missing}, unpublished={unpublished}")

          for page in game_pages:
              html = page.read_text(encoding="utf-8")
              viewport = re.search(r'<meta\b(?=[^>]*\bname=["\']viewport["\'])(?=[^>]*\bcontent=["\'][^"\']*width=device-width[^"\']*["\'])[^>]*>', html, re.I)
              if not viewport:
                  raise SystemExit(f"Game page is missing a mobile viewport: {page}")
              icon = re.search(r'<link\b[^>]*\brel=["\'](?:shortcut\s+)?icon["\'][^>]*\bhref=["\']([^"\']+)["\']', html, re.I)
              if not icon:
                  raise SystemExit(f"Missing favicon link in {page}")
              href = icon.group(1)
              if href.startswith("http"):
                  raise SystemExit(f"External favicon is not allowed for local games: {page}: {href}")
              icon_path = (dist / href.lstrip("/")) if href.startswith("/") else (page.parent / href)
              if not icon_path.is_file():
                  raise SystemExit(f"Favicon target does not exist for {page}: {href}")

          papa_pages = list((dist / "games").glob("papas-*/index.html"))
          papa_slugs = {game.get("slug") for game in games if str(game.get("slug", "")).startswith("papas-")}
          expected_papa_pages = {dist / "games" / slug / "index.html" for slug in papa_slugs}
          actual_papa_pages = set(papa_pages)
          if actual_papa_pages != expected_papa_pages:
              missing = sorted(str(path.relative_to(dist)) for path in expected_papa_pages - actual_papa_pages)
              unexpected = sorted(str(path.relative_to(dist)) for path in actual_papa_pages - expected_papa_pages)
              raise SystemExit(f"Papa wrapper/catalogue mismatch. Missing={missing}, unexpected={unexpected}")
          for page in papa_pages:
              html = page.read_text(encoding="utf-8")
              if '/games/ruffle/ruffle.js' not in html or 'new URL("/games/ruffle/"' not in html:
                  raise SystemExit(f"Incorrect local Ruffle paths in {page}")

          for game in games:
              if not str(game.get("slug", "")).startswith("motox3m") or not str(game.get("url", "")).startswith("/games/"):
                  continue
              page = dist / game["url"].lstrip("/")
              html = page.read_text(encoding="utf-8")
              if re.search(r"gamebridge|pk-sdk|imasdk\.googleapis|adsbygoogle|cdn\.y8\.com|gamebreakbeta", html, re.I):
                  raise SystemExit(f"Ad SDK reference remains in {page}")

          print(f"Verified {len(game_pages)} local game pages against the catalogue.")
          print(f"Verified {len(external_games)} HTTPS source-site game links.")
          print(f"Verified local favicons for all game pages and {len(papa_pages)} Papa wrappers.")
          print("All Pages output assets meet the 25 MiB limit.")
          PY
