name: Validate manually assigned game favicons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ensure-game-favicons.yml"
      - "catalog/games.json"
      - "games/**/index.html"
      - "favicons/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify assigned local favicons without generating replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root = Path(".")
          catalogue = json.loads((root / "catalog/games.json").read_text(encoding="utf-8"))
          missing = []
          checked = 0
          for game in catalogue.get("games", []):
              if game.get("published") is False or not str(game.get("url", "")).startswith("/games/"):
                  continue
              page = root / game["url"].lstrip("/")
              if not page.is_file():
                  missing.append(f"{game.get('slug')}: launch page missing")
                  continue
              html = page.read_text(encoding="utf-8", errors="replace")
              match = re.search(r'<link\b(?=[^>]*\brel=["\'](?:shortcut\s+)?icon["\'])[^>]*\bhref=["\']([^"\']+)["\']', html, re.I)
              if not match:
                  missing.append(f"{game.get('slug')}: favicon link missing")
                  continue
              href = match.group(1)
              if href.startswith(("http://", "https://", "//", "data:")):
                  missing.append(f"{game.get('slug')}: favicon is not local ({href})")
                  continue
              target = root / href.lstrip("/") if href.startswith("/") else page.parent / href
              if not target.is_file():
                  missing.append(f"{game.get('slug')}: favicon asset missing ({href})")
              checked += 1
          if missing:
              raise SystemExit("Favicon validation failed:\n" + "\n".join(missing))
          print(f"Verified {checked} local favicon links. No files were generated or modified.")
          PY
