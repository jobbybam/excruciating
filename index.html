<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Browse and play browser games.">
  <title>excruciating</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="excruciating home">excruciating</a>
    <label class="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
      <input id="search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
      <kbd>/</kbd>
    </label>
    <button class="chat-toggle" id="chat-toggle" type="button" aria-label="Open chat" title="Chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.8-3A7.5 7.5 0 1 1 20 11.5Z"></path></svg>
    </button>
  </header>

  <main class="shell">
    <nav class="categories" id="categories" aria-label="Game categories">
      <button class="category active" data-category="All" type="button">All games</button>
      <button class="category" data-category="Arcade" type="button">Arcade</button>
      <button class="category" data-category="Action" type="button">Action</button>
      <button class="category" data-category="Racing" type="button">Racing</button>
      <button class="category" data-category="Sports" type="button">Sports</button>
      <button class="category" data-category="Puzzle" type="button">Puzzle</button>
      <button class="category" data-category="Multiplayer" type="button">Multiplayer</button>
    </nav>

    <section class="library" aria-labelledby="library-heading">
      <div class="section-heading">
        <h1 id="library-heading">Games</h1>
        <span id="game-count" class="muted">0 games</span>
      </div>
      <div id="game-grid" class="game-grid" aria-live="polite"></div>
      <div id="empty-state" class="empty-state">
        <div class="empty-mark">—</div>
        <h2>No games added yet</h2>
        <p>Games will appear here as they're added to the library.</p>
      </div>
    </section>
  </main>

  <section id="player" class="player-page" hidden aria-label="Game player">
    <div class="player-toolbar">
      <button id="back-button" class="toolbar-button" type="button">← <span>Games</span></button>
      <h2 id="player-title">Game</h2>
      <div class="player-actions">
        <button id="reload-button" class="toolbar-button" type="button">↻ <span>Reload</span></button>
        <button id="fullscreen-button" class="toolbar-button" type="button">⛶ <span>Fullscreen</span></button>
      </div>
    </div>
    <div class="game-frame-wrap" id="game-frame-wrap">
      <div id="player-placeholder" class="player-placeholder">Select a game to play.</div>
      <iframe id="game-frame" title="Game" allow="fullscreen; gamepad; autoplay" referrerpolicy="no-referrer" hidden></iframe>
    </div>
  </section>

  <aside id="chat-panel" class="chat-panel" hidden aria-label="Public chat">
    <div class="chat-heading"><strong>Chat</strong><button id="chat-close" type="button" aria-label="Close chat">×</button></div>
    <div class="chat-notice">Chat is being set up.</div>
    <p class="chat-footnote">Username-based public chat will be connected to the backend before launch.</p>
  </aside>
  <footer><span>excruciating</span><span> </span></footer>
</body>
</html>
